name: Build & Release (NPM & Docker)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      npm_package_name:
        description: 'NPM Package Name (e.g. @abdurakhman/cap-widget)'
        required: true
        default: '@abdurakhman/cap-widget'
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # 1. СБОРКА И ПУБЛИКАЦИЯ В NPMJS
  # ==========================================
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for NPM registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install widget build dependencies
        run: cd widget && bun install

      - name: Build Unbranded Widget
        env:
          NPM_PACKAGE_NAME: ${{ github.event.inputs.npm_package_name || vars.NPM_PACKAGE_NAME || '@abdurakhman/cap-widget' }}
          PACKAGE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: bun run scripts/build-unbranded.mjs

      - name: Publish to NPM
        working-directory: ./widget/src
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ==========================================
  # 2. СБОРКА И ПУШ DOCKER ОБРАЗА
  # ==========================================
  publish-docker:
    runs-on: ubuntu-latest
    needs: publish-npm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies & Build clean widget for standalone
        run: |
          cd widget && bun install
          cd ..
          bun run scripts/build-unbranded.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/cap-standalone
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: standalone/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
